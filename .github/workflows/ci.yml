# CI informativo (Fase 01A-00).
# Objetivo: medir y dejar visible el estado de calidad del repositorio SIN bloquear nada.
#  - No despliega, no fusiona, no toca la base de datos ni servicios externos.
#  - Todos los pasos de verificación usan continue-on-error: el job no falla por errores
#    previos; el resultado de cada paso queda en el resumen del job.
#  - No usa secretos del repositorio. Las variables de abajo son marcadores de posición.
#  - Cuando el estado base esté saneado, se retirará continue-on-error (PR aparte, con aprobación).
name: CI (informativo)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      LOCAL_AUTH: "true"
      JWT_SECRET: ci-only-placeholder-not-a-secret-000000000000
      EMAIL_ENCRYPTION_KEY: ci-only-placeholder-not-a-secret-000000000000
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos (tsc --noEmit)
        id: typecheck
        continue-on-error: true
        run: pnpm check

      - name: Tests (vitest)
        id: tests
        continue-on-error: true
        run: pnpm test

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Higiene del repositorio (solo nombres de fichero, nunca contenido)
        id: hygiene
        continue-on-error: true
        run: |
          echo "Ficheros versionados bajo .manus/: $(git ls-files .manus | wc -l)"
          echo "--- Migraciones SQL con apariencia de hash bcrypt (solo nombres) ---"
          git grep -lE '\$2[aby]\$[0-9]{2}\$' -- 'drizzle/*.sql' || echo "(ninguna)"
          echo "--- Ficheros versionados bajo .manus/ con la clave passwordHash (solo nombres) ---"
          git grep -l 'passwordHash' -- .manus | head -20 || echo "(ninguno)"
          echo "--- Migraciones SQL fuera del journal de drizzle ---"
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("drizzle/meta/_journal.json", "utf8"));
            const inJournal = new Set(j.entries.map(e => e.tag));
            const files = fs.readdirSync("drizzle").filter(f => f.endsWith(".sql")).map(f => f.slice(0, -4));
            const orphans = files.filter(f => !inJournal.has(f));
            console.log(orphans.length ? orphans.join("\n") : "(ninguna)");
          '

      - name: Verificar migraciones nuevas (db/migrations)
        id: migrations
        continue-on-error: true
        run: pnpm exec tsx scripts/db/migrate.ts verify --dir db/migrations

      - name: Ratchet de deuda técnica (la deuda no puede aumentar)
        id: ratchet
        continue-on-error: true
        run: node scripts/ci/ratchet.cjs

      - name: Resumen
        if: always()
        run: |
          {
            echo "## CI informativo"
            echo ""
            echo "| Paso | Resultado |"
            echo "|---|---|"
            echo "| Tipos (tsc) | ${{ steps.typecheck.outcome }} |"
            echo "| Tests (vitest) | ${{ steps.tests.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Higiene | ${{ steps.hygiene.outcome }} |"
            echo "| Migraciones nuevas (verify) | ${{ steps.migrations.outcome }} |"
            echo "| Ratchet de deuda | ${{ steps.ratchet.outcome }} |"
            echo ""
            echo "Este CI es informativo: un resultado 'failure' no bloquea el PR."
          } >> "$GITHUB_STEP_SUMMARY"

  baseline:
    name: Baseline de esquema (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only
          MYSQL_DATABASE: baseline
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DRIFT_DATABASE_URL: mysql://root:ci_only@127.0.0.1:3306/baseline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar la baseline a una base de datos vacía
        id: apply
        continue-on-error: true
        run: mysql -h127.0.0.1 -uroot -pci_only baseline < db/baseline/0000_baseline.sql

      - name: Auditar contra drizzle/schema.ts
        id: audit
        continue-on-error: true
        run: |
          pnpm exec tsx scripts/audit-schema-drift.ts --json drift.json
          node scripts/ci/assert-no-missing-columns.cjs drift.json

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Baseline de esquema"
            echo ""
            echo "| Paso | Resultado |"
            echo "|---|---|"
            echo "| Aplicar baseline a MySQL vacío | ${{ steps.apply.outcome }} |"
            echo "| Sin columnas que falten frente a schema.ts | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Suites propias de la transformación SaaS: BLOQUEANTES (sin continue-on-error).
  # Incluye las pruebas de integración con MySQL real (aislamiento, aprovisionamiento,
  # facturación, copias verificadas, aplicación real en multiempresa).
  core-suites:
    name: Suites del Core multiempresa (bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only
          MYSQL_DATABASE: registry_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pci_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      NODE_ENV: test
      LOCAL_AUTH: "true"
      JWT_SECRET: ci-only-placeholder-not-a-secret-000000000000
      EMAIL_ENCRYPTION_KEY: ci-only-placeholder-not-a-secret-000000000000
      REGISTRY_TEST_DATABASE_URL: mysql://root:ci_only@127.0.0.1:3306/registry_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Todos los carriles de migraciones (app y, si existe, CRM): verify no usa base de datos.
      - name: Verificar migraciones (todos los carriles)
        run: |
          pnpm exec tsx scripts/db/migrate.ts verify --dir db/migrations
          if [ -d db/crm/migrations ]; then pnpm exec tsx scripts/db/migrate.ts verify --dir db/crm/migrations; fi

      - name: Suites propias unitarias (en paralelo)
        run: >-
          pnpm exec vitest run
          --exclude "**/*.mysql.test.ts" --exclude "node_modules/**"
          server/tenant server/erm server/modules server/moduleRouteGuard
          server/provisioning server/billing server/support server/controlPlane
          server/backup server/ops server/mailer server/integrationEnv
          server/legacyDb server/migrationRunner server/poolConsolidation
          server/kbRoute server/ghlInboxRouter server/documentAccess
          server/accountSecurity server/sessionAndUploads server/redsys.security
          server/rbac server/health
          server/crm server/subscriptions server/trials server/nayadeBundle
          server/legacyCredentials server/schemaCheck server/schemaPlanReadonly
          server/startupConnections server/catalog server/capabilities server/organization
          server/productIdentity server/creditNoteNumber server/sdk server/skiRental
          server/tenantIdentity server/inventoryHolds server/setupWizard

      # Las pruebas con MySQL comparten una base de datos: se ejecutan una a una
      - name: Suites de integración con MySQL real (en serie)
        run: pnpm exec vitest run mysql --no-file-parallelism

  # Secretos y ficheros sensibles: BLOQUEANTE. Solo mira lo nuevo de cada PR o push (el historial anterior
  # se trata aparte); el árbol completo sí debe estar limpio.
  secrets:
    name: Secretos y ficheros sensibles (bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo para analizar el rango)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rango a analizar
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE=$(git merge-base "$PR_BASE" "$PR_HEAD"); HEAD="$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"; HEAD="$AFTER"
          else
            BASE="$AFTER~1"; HEAD="$AFTER"
          fi
          echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
          echo "Rango: $BASE..$HEAD ($(git rev-list --count "$BASE..$HEAD") commits)"

      - name: Ficheros sensibles en el árbol
        run: node scripts/ci/sensitive-files.mjs --tracked

      - name: Ficheros sensibles en los commits nuevos (incluida historia que llegue por fusión)
        run: node scripts/ci/sensitive-files.mjs --range "${{ steps.range.outputs.range }}"

      - name: gitleaks (versión fijada y suma verificada)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --log-opts="${{ steps.range.outputs.range }}" --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas de los controles
        run: pnpm exec vitest run server/sensitiveFiles
