# Despliegue de Elephant Source en Railway (proyecto propio, aislado de Náyade y Skicenter).
#
# - Manual (workflow_dispatch) o llamado por el CI de integration/elephant-source (workflow_call, solo «publicar» en
#   live), y SOLO desde integration/elephant-source. main nunca publica Elephant Source.
# - Entorno de GitHub «elephant-source-<entorno>» con el secreto RAILWAY_TOKEN = token de PROYECTO de Railway para ese
#   entorno. Sin él, el flujo se detiene sin hacer nada.
# - Antes de tocar nada, scripts/deploy/esRailway.ts comprueba que el token es del proyecto de Elephant Source y
#   del entorno elegido (deploy/railway/elephant-source.deploy.json); si no, se detiene.
# - Una acción por ejecución, en el orden del plan (docs/elephant-source/PLAN_PUBLICACION.md).
# - Publicación continua (docs/elephant-source/PROTOCOLO_PUBLICACION.md): «publicar» y «revertir-*» son despliegues
#   ORDINARIOS (solo el código de controlplane, core y core-gateway, con vuelta atrás automática). En production usan el
#   entorno «elephant-source-production-despliegue» (sin aprobación) y solo publican un commit que ya superó el CI y live
#   y que no trae migraciones, infraestructura ni interruptores de funciones bloqueadas. Todo lo demás en production usa
#   «elephant-source-production» (con aprobación obligatoria).
name: Despliegue Elephant Source

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de Railway"
        required: true
        type: choice
        options: [live, production]
      action:
        description: "Acción (una por ejecución, en el orden del plan)"
        required: true
        type: choice
        options:
          - publicar
          - revertir-controlplane
          - revertir-core
          - revertir-core-gateway
          - revertir-crm
          - revertir-web
          - verificar-token
          - estado
          - diagnostico-almacenamiento
          - almacenamiento-referencias
          - desplegar-restore-drill
          - desplegar-backup-job
          - copia-de-seguridad
          - verificar-copia
          - migraciones-plataforma-simulacion
          - migraciones-plataforma-aplicar
          - migraciones-simulacion
          - migraciones-aplicar
          - verificar-migraciones
          - desplegar-controlplane
          - desplegar-core
          - desplegar-core-gateway
          - desplegar-crm
          - desplegar-web
          - comprobar-salud
          - preparar-production
          - aplicar-production
          - purgar-empresas-prueba
          - preparar-pruebas-live
          - diagnostico-correo-live
          - correo-pruebas-live
          - huerfanos
          - correo-acceso-estado
          - correo-acceso-activar
          - correo-acceso-desactivar
          - correo-contratos-estado
          - correo-contratos-activar
          - catalogo-revision
          - catalogo-revision-aplicar
          - catalogo-fichas
          - catalogo-fichas-aplicar
          - catalogo-fichas-publicar
          - catalogo-fichas-publicar-aplicar
          - catalogo-fichas-revertir
          - catalogo-fichas-revertir-aplicar
          - catalogo-fichas-integridad
          - avisos-solicitudes-estado
          - avisos-solicitudes-activar
          - avisos-solicitudes-desactivar
          - medicion-preparar
          - medicion-comprobar
          - dominio-plataforma-live-estado
          - dominio-plataforma-live-crear
          - dominio-plataforma-live-activar
          - dominio-plataforma-live-certificado
      commit:
        description: "Commit a desplegar (opcional; por defecto, el último de la rama). Para volver atrás: uno anterior de la misma rama"
        required: false
        type: string
      only:
        description: "Empresas (opcional, separadas por comas) para copias y migraciones"
        required: false
        type: string
      destinatarios:
        description: "Correo: direcciones autorizadas, separadas por comas (pruebas de live o buzones internos de los avisos de solicitudes)"
        required: false
        type: string
      confirm:
        description: "Escribe el nombre del entorno para confirmar"
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
      confirm:
        required: true
        type: string
      # Publicación automática encadenada por el CI (no una ejecución manual): lo protegido se omite con aviso
      auto:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read
  statuses: write

# Un solo despliegue a la vez por entorno, también entre la publicación automática y las acciones manuales
concurrency:
  group: deploy-elephant-source-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    # Production: lo ordinario (publicar, revertir, solo lectura, copias y revisiones auditadas; ORDINARY_PRODUCTION_ACTIONS
    # en scripts/deploy/esRailwayLib.ts) va sin aprobación; lo extraordinario (variables, secretos, correo real, almacenamiento,
    # migraciones o restauraciones a mano), por el entorno protegido. Orden permanente del propietario (26/10/2026).
    environment: ${{ inputs.environment == 'production' && (contains(fromJSON('["publicar","estado","verificar-token","comprobar-salud","diagnostico-almacenamiento","copia-de-seguridad","verificar-copia","migraciones-plataforma-simulacion","migraciones-simulacion","verificar-migraciones","huerfanos","correo-acceso-estado","avisos-solicitudes-estado","medicion-comprobar","catalogo-revision","catalogo-revision-aplicar","catalogo-fichas","catalogo-fichas-aplicar","catalogo-fichas-publicar","catalogo-fichas-publicar-aplicar","catalogo-fichas-revertir","catalogo-fichas-revertir-aplicar","catalogo-fichas-integridad"]'), inputs.action) || startsWith(inputs.action, 'revertir-')) && 'elephant-source-production-despliegue' || format('elephant-source-{0}', inputs.environment) }}
    timeout-minutes: 60
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      ES_GATEWAY_AUTH: ${{ secrets.ES_GATEWAY_AUTH }}
      GH_TOKEN: ${{ github.token }}
      ES_ENV: ${{ inputs.environment }}
      ES_ONLY: ${{ inputs.only }}
      ES_ACTION: ${{ inputs.action }}
      ES_CONFIRM: ${{ inputs.confirm }}
      ES_COMMIT: ${{ inputs.commit }}
      ES_MAIL_ALLOW: ${{ inputs.destinatarios }}
      ES_AUTO: ${{ inputs.auto }}
      # La web comercial entra en la publicación solo si el entorno tiene su clave de lectura (si no, se omite con aviso)
      ES_WEB_ENABLED: ${{ secrets.WEB_DEPLOY_KEY != '' }}
    steps:
      - name: Comprobaciones previas (rama, confirmación y credencial)
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/integration/elephant-source" ]; then echo "Solo desde integration/elephant-source (es ${GITHUB_REF})"; exit 1; fi
          if [ "${ES_CONFIRM}" != "${ES_ENV}" ]; then echo "Confirmación incorrecta"; exit 1; fi
          if [ -z "${RAILWAY_TOKEN}" ]; then echo "Sin RAILWAY_TOKEN en el entorno elephant-source-${ES_ENV}: no se hace nada."; exit 1; fi
          if [ -n "${ES_COMMIT}" ] && ! printf '%s' "${ES_COMMIT}" | grep -Eq '^[0-9a-f]{7,40}$'; then echo "Commit no válido"; exit 1; fi
          if [ -n "${ES_ONLY}" ] && ! printf '%s' "${ES_ONLY}" | grep -Eq '^[a-z0-9][a-z0-9-]{1,62}(,[a-z0-9][a-z0-9-]{1,62})*$'; then echo "Lista de empresas no válida"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: CLI de Railway (versión fijada)
        if: startsWith(inputs.action, 'desplegar-') || inputs.action == 'publicar' || inputs.action == 'preparar-pruebas-live' || inputs.action == 'correo-pruebas-live' || inputs.action == 'preparar-production' || inputs.action == 'aplicar-production' || inputs.action == 'purgar-empresas-prueba' || inputs.action == 'medicion-preparar' || startsWith(inputs.action, 'catalogo-revision') || startsWith(inputs.action, 'catalogo-fichas')
        run: npm install -g @railway/cli@5.68.0

      - name: Verificar que el token es de Elephant Source y del entorno elegido
        run: pnpm exec tsx scripts/deploy/esRailway.ts verify --env "${ES_ENV}"

      - name: Estado (despliegue activo de cada servicio; anotarlo como punto de vuelta atrás)
        if: inputs.action == 'estado'
        run: pnpm exec tsx scripts/deploy/esRailway.ts status --env "${ES_ENV}"

      - name: Diagnóstico del almacenamiento (solo lectura; sin valores de claves)
        if: inputs.action == 'diagnostico-almacenamiento'
        run: pnpm exec tsx scripts/deploy/esRailway.ts storage --env "${ES_ENV}"

      # Variables de almacenamiento como REFERENCIAS a los buckets del entorno (production: solo backup-job y
      # restore-drill, autorizado por el propietario el 23/10/2026). Si una referencia no da valor, se restaura y se para.
      - name: Almacenamiento como referencias a los buckets (sin desplegar)
        if: inputs.action == 'almacenamiento-referencias'
        run: pnpm exec tsx scripts/deploy/esRailway.ts storage-fix --env "${ES_ENV}"

      # Pruebas de live (autorizado por el propietario el 23/10/2026): almacenamiento como referencias a los buckets de
      # live y pasarelas propias de live gw-prueba-a/gw-prueba-b (creadas solo en live con la configuración de
      # core-gateway) con el dominio de las dos empresas de prueba (only). Después se despliega el Core. Nunca en production.
      - name: Pruebas de live — solo live y dos empresas de prueba
        if: inputs.action == 'preparar-pruebas-live'
        run: |
          if [ "${ES_ENV}" != "live" ]; then echo "preparar-pruebas-live solo existe en live"; exit 1; fi
          if ! printf '%s' "${ES_ONLY}" | grep -Eq '^cms-prueba-a-[0-9]{8},cms-prueba-b-[0-9]{8}$'; then echo "only: cms-prueba-a-AAAAMMDD,cms-prueba-b-AAAAMMDD"; exit 1; fi

      - name: Pruebas de live — almacenamiento como referencias a los buckets
        if: inputs.action == 'preparar-pruebas-live'
        run: pnpm exec tsx scripts/deploy/esRailway.ts storage-fix --env "${ES_ENV}"

      # Correo de PRUEBAS en live con Postmark (autorizado por el propietario el 23/10/2026): diagnóstico de solo lectura,
      # o MAIL_MODE=sandbox limitado a los destinatarios indicados, webhook de Postmark y despliegue. Nunca en production.
      - name: Correo de pruebas — solo live
        if: inputs.action == 'diagnostico-correo-live' || inputs.action == 'correo-pruebas-live'
        run: |
          if [ "${ES_ENV}" != "live" ]; then echo "El correo de pruebas solo existe en live"; exit 1; fi
          if [ "${ES_ACTION}" = "correo-pruebas-live" ] && ! printf '%s' "${ES_MAIL_ALLOW}" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(,[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}){0,9}$'; then echo "destinatarios: entre 1 y 10 direcciones completas separadas por comas"; exit 1; fi

      - name: Correo de pruebas — diagnóstico de Postmark (solo lectura)
        if: inputs.action == 'diagnostico-correo-live'
        run: pnpm exec tsx scripts/deploy/esRailway.ts mail-live --env "${ES_ENV}"

      # Subdominios automáticos de las empresas de LIVE (como *.app.bigelephant.es en production): comodín *.live.bigelephant.es
      # en la pasarela compartida core-gateway. estado: solo lectura (registros DNS y certificado); crear: añade el dominio
      # en Railway (sin efecto hasta que exista el DNS); activar: con el DNS verificado, CP_PLATFORM_DOMAINS. Nunca en production.
      - name: Dominio de plataforma de live
        if: startsWith(inputs.action, 'dominio-plataforma-live-')
        run: |
          if [ "${ES_ENV}" != "live" ]; then echo "El dominio de plataforma de pruebas solo existe en live"; exit 1; fi
          case "${ES_ACTION}" in
            dominio-plataforma-live-estado) pnpm exec tsx scripts/deploy/esRailway.ts platform-domain --env "${ES_ENV}" --operaciones ;;
            dominio-plataforma-live-crear) pnpm exec tsx scripts/deploy/esRailway.ts platform-domain --env "${ES_ENV}" --apply ;;
            dominio-plataforma-live-activar) pnpm exec tsx scripts/deploy/esRailway.ts platform-domain --env "${ES_ENV}" --variables ;;
            dominio-plataforma-live-certificado) pnpm exec tsx scripts/deploy/esRailway.ts platform-domain --env "${ES_ENV}" --emitir-certificado ;;
          esac

      - name: Correo de pruebas — sandbox, webhook y variables
        if: inputs.action == 'correo-pruebas-live'
        run: pnpm exec tsx scripts/deploy/esRailway.ts mail-live --env "${ES_ENV}" --allow "${ES_MAIL_ALLOW}"

      - name: Commit a desplegar (debe pertenecer a integration/elephant-source)
        if: startsWith(inputs.action, 'desplegar-') || inputs.action == 'publicar' || inputs.action == 'preparar-pruebas-live' || inputs.action == 'correo-pruebas-live' || inputs.action == 'preparar-production' || inputs.action == 'aplicar-production' || inputs.action == 'purgar-empresas-prueba' || inputs.action == 'medicion-preparar' || startsWith(inputs.action, 'catalogo-revision') || startsWith(inputs.action, 'catalogo-fichas')
        run: |
          SHA="${ES_COMMIT:-${GITHUB_SHA}}"
          git merge-base --is-ancestor "${SHA}" "${GITHUB_SHA}" || { echo "El commit ${SHA} no es de integration/elephant-source"; exit 1; }
          echo "ES_DEPLOY_SHA=$(git rev-parse "${SHA}")" >> "${GITHUB_ENV}"

      - name: Copia de seguridad (todas o las indicadas)
        if: inputs.action == 'copia-de-seguridad'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js run${ES_ONLY:+ --only ${ES_ONLY}}"

      - name: Verificar la copia en el bucket (solo lectura; últimas 24 h)
        if: inputs.action == 'verificar-copia'
        run: pnpm exec tsx scripts/deploy/esRailway.ts backup-check --env "${ES_ENV}"

      - name: Migraciones de plataforma, registro y CRM (simulación)
        if: inputs.action == 'migraciones-plataforma-simulacion'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs registry plan"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs crm status"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs crm plan"

      - name: Migraciones de plataforma, registro y CRM (aplicar; tras la copia de seguridad)
        if: inputs.action == 'migraciones-plataforma-aplicar'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs registry apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs crm apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs crm status"

      - name: Migraciones de las empresas (simulación)
        if: inputs.action == 'migraciones-simulacion'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js migrate-tenants${ES_ONLY:+ --only ${ES_ONLY}}"

      - name: Migraciones de las empresas (aplicar; canario primero)
        if: inputs.action == 'migraciones-aplicar'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js migrate-tenants${ES_ONLY:+ --only ${ES_ONLY}} --apply"

      # Recursos huérfanos del aprovisionamiento (solo lectura): bases y usuarios sin empresa, empresas sin base
      - name: Recursos huérfanos (solo lectura)
        if: inputs.action == 'huerfanos'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js orphans"

      # Correo de ACCESO de las empresas (docs/runbooks/CORREO_ACCESO_EMPRESAS.md), solo production y solo core:
      # estado (lectura; validez del token sin enviar nada), activar (solo las empresas de «only» y solo invitación,
      # restablecimiento y aviso; el plano de control sigue en off) y desactivar (MAIL_MODE=off). Nunca imprime un token.
      - name: Correo de acceso de las empresas
        if: startsWith(inputs.action, 'correo-acceso-')
        run: |
          if [ "${ES_ENV}" != "production" ]; then echo "El correo de acceso limitado solo se gestiona en production"; exit 1; fi
          case "${ES_ACTION}" in
            correo-acceso-estado) pnpm exec tsx scripts/deploy/esRailway.ts mail-access --env "${ES_ENV}" --accion estado ${ES_ONLY:+--tenants "${ES_ONLY}"} ;;
            correo-acceso-activar) pnpm exec tsx scripts/deploy/esRailway.ts mail-access --env "${ES_ENV}" --accion activar --tenants "${ES_ONLY}" ;;
            correo-acceso-desactivar) pnpm exec tsx scripts/deploy/esRailway.ts mail-access --env "${ES_ENV}" --accion desactivar ;;
          esac

      # Avisos INTERNOS de solicitudes web (docs/runbooks/AVISOS_SOLICITUDES_WEB.md), solo production y solo el plano de
      # control: estado (lectura), activar (sandbox: solo los buzones de «destinatarios» y solo la categoría
      # lead_request_notice; core y el correo de acceso de Skibox no se tocan) y desactivar (MAIL_MODE=off del plano de control).
      - name: Avisos de solicitudes web
        if: startsWith(inputs.action, 'avisos-solicitudes-')
        run: |
          if [ "${ES_ENV}" != "production" ]; then echo "Los avisos de solicitudes se gestionan aquí solo en production"; exit 1; fi
          case "${ES_ACTION}" in
            avisos-solicitudes-estado) pnpm exec tsx scripts/deploy/esRailway.ts lead-notices-mail --env "${ES_ENV}" --accion estado ;;
            avisos-solicitudes-activar) pnpm exec tsx scripts/deploy/esRailway.ts lead-notices-mail --env "${ES_ENV}" --accion activar --allow "${ES_MAIL_ALLOW}" ;;
            avisos-solicitudes-desactivar) pnpm exec tsx scripts/deploy/esRailway.ts lead-notices-mail --env "${ES_ENV}" --accion desactivar ;;
          esac

      # Correo de CONTRATOS de servicios externos (contract_invitation), solo production y solo el plano de control:
      # estado (lectura) y activar (AÑADE la categoría y los buzones de «destinatarios» al sandbox de los avisos; nunca live)
      - name: Correo de contratos de servicios externos
        if: startsWith(inputs.action, 'correo-contratos-')
        run: |
          if [ "${ES_ENV}" != "production" ]; then echo "El correo de contratos se gestiona aquí solo en production"; exit 1; fi
          case "${ES_ACTION}" in
            correo-contratos-estado) pnpm exec tsx scripts/deploy/esRailway.ts contract-mail --env "${ES_ENV}" --accion estado ;;
            correo-contratos-activar) pnpm exec tsx scripts/deploy/esRailway.ts contract-mail --env "${ES_ENV}" --accion activar --allow "${ES_MAIL_ALLOW}" ;;
          esac

      - name: Verificar el esquema de la exportación (0011, 0012, 0013)
        if: inputs.action == 'verificar-migraciones'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js check-data-exports${ES_ONLY:+ --only ${ES_ONLY}}"

      - name: Export del commit (sin railway.toml ni datos de semilla)
        if: startsWith(inputs.action, 'desplegar-') || inputs.action == 'publicar' || inputs.action == 'preparar-pruebas-live' || inputs.action == 'correo-pruebas-live' || inputs.action == 'preparar-production' || inputs.action == 'aplicar-production' || inputs.action == 'purgar-empresas-prueba' || inputs.action == 'medicion-preparar' || startsWith(inputs.action, 'catalogo-revision') || startsWith(inputs.action, 'catalogo-fichas')
        run: pnpm exec tsx scripts/deploy/esRailway.ts export --sha "${ES_DEPLOY_SHA}" --out "${RUNNER_TEMP}/export"

      # Revisión de estados comerciales del catálogo (docs/runbooks/CATALOGO_ESTADOS_COMERCIALES.md): restore-drill con ESTE
      # commit y la orden catalog-review (simulación, o aplicación con autor e historial; solo cambia lo que sigue en su
      # estado de partida). En production, entorno protegido (aprobación). Nunca toca precios, licencias, Stripe ni cobros.
      - name: Revisión de estados del catálogo
        if: startsWith(inputs.action, 'catalogo-revision')
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js catalog-review"
          if [ "${ES_ACTION}" = "catalogo-revision-aplicar" ]; then
            pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js catalog-review --apply"
          fi

      # Fichas comerciales (docs/runbooks/CATALOGO_COMERCIAL_UNIFICADO.md): restore-drill con ESTE commit y la orden
      # catalog-commercial-import (simulación, o borradores con autor e historial). Nunca publica: cada ficha se publica
      # desde el CRM. Nunca toca precios, licencias, Stripe ni cobros; el interruptor de la política sigue apagado.
      - name: Fichas comerciales del catálogo (borradores)
        if: inputs.action == 'catalogo-fichas' || inputs.action == 'catalogo-fichas-aplicar'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js catalog-commercial-import"
          if [ "${ES_ACTION}" = "catalogo-fichas-aplicar" ]; then
            pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js catalog-commercial-import --apply"
          fi

      # Publicación por lotes de las fichas (publishBatch.ts) o reversión del último lote, con simulación siempre antes y
      # foto de integridad (suscripciones, pedidos, pagos y licencias) antes y después. Solo vuelve a publicar fichas de
      # productos ya publicados; lo bloqueado queda en borrador con su causa. La web se regenera con la siguiente
      # publicación del Core. «catalogo-fichas-integridad»: solo la foto, sin cambiar nada.
      - name: Fichas comerciales del catálogo (publicación por lotes, reversión e integridad)
        if: startsWith(inputs.action, 'catalogo-fichas-publicar') || startsWith(inputs.action, 'catalogo-fichas-revertir') || inputs.action == 'catalogo-fichas-integridad'
        run: |
          drill() { pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js $1"; }
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          drill "commercial-integrity"
          case "${ES_ACTION}" in
            catalogo-fichas-publicar) drill "catalog-commercial-publish" ;;
            catalogo-fichas-publicar-aplicar) drill "catalog-commercial-publish" && drill "catalog-commercial-publish --apply" && drill "commercial-integrity" ;;
            catalogo-fichas-revertir) drill "catalog-commercial-revert" ;;
            catalogo-fichas-revertir-aplicar) drill "catalog-commercial-revert" && drill "catalog-commercial-revert --apply" && drill "commercial-integrity" ;;
          esac

      # Medición del Resource Manager (base es_erm, como live desde el 21/10/2026): contraseña del usuario es_erm en
      # MySQL.ES_ERM_PASSWORD (generada si falta; nunca se imprime) y referencias; restore-drill con ESTE commit crea o ajusta
      # la base y el usuario (idempotente, permisos mínimos, sonda sin restos); core y controlplane por referencia y se
      # despliegan. En production, entorno protegido (aprobación). Si una referencia no da valor, se restaura y se para.
      - name: Medición — base es_erm, referencias y despliegue
        if: inputs.action == 'medicion-preparar'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts metering --env "${ES_ENV}" --secret
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js erm-setup --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts metering --env "${ES_ENV}" --refs
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service core --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service controlplane --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts functional --env "${ES_ENV}"
          pnpm exec tsx scripts/deploy/esRailway.ts storage --env "${ES_ENV}"
          # Prueba de que llega consumo real: tras un volcado del agregador (15 s), el agregado de 24 h por empresa
          sleep 90
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js erm-setup"

      # Comprobación de solo lectura de la medición: consumo agregado de 24 h por empresa (sin cambios ni datos personales)
      - name: Medición — comprobar (solo lectura)
        if: inputs.action == 'medicion-comprobar'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js erm-setup"

      # ── Despliegue ordinario (publicar) ──
      - name: Publicar — production solo con CI y live superados por el mismo commit
        if: inputs.action == 'publicar' && inputs.environment == 'production'
        run: |
          LIVE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ES_DEPLOY_SHA}/status" --jq '.statuses[] | select(.context == "elephant-source/live") | .state' | head -1)
          if [ "${LIVE}" != "success" ]; then echo "El commit ${ES_DEPLOY_SHA} no ha superado live (estado: ${LIVE:-ninguno}). No se publica."; exit 1; fi
          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ES_DEPLOY_SHA}/check-runs?per_page=100" --jq '.check_runs[] | "\(.name)|\(.conclusion)"')
          for JOB in "Suites del Core multiempresa (bloqueante)" "Secretos y ficheros sensibles (bloqueante)"; do
            if ! printf '%s\n' "${RUNS}" | grep -Fxq "${JOB}|success"; then echo "El CI «${JOB}» no está en verde para ${ES_DEPLOY_SHA}. No se publica."; exit 1; fi
          done
          echo "CI y live superados por ${ES_DEPLOY_SHA}"

      - name: Publicar — qué trae respecto a lo activo (en production, nada que exija el procedimiento protegido)
        if: inputs.action == 'publicar'
        run: |
          FROM=$(pnpm exec tsx scripts/deploy/esRailway.ts active-sha --env "${ES_ENV}")
          if [ "${ES_ENV}" = "production" ]; then
            set +e
            pnpm exec tsx scripts/deploy/esRailway.ts changes ${FROM:+--from "${FROM}"} --to "${ES_DEPLOY_SHA}" --production > "${RUNNER_TEMP}/changes.txt"
            RC=$?
            set -e
            cat "${RUNNER_TEMP}/changes.txt"
            # Migraciones aditivas: copia verificada y aplicación automáticas antes de publicar el código (paso siguiente)
            if [ "${RC}" = "0" ] && ! grep -qx "migrations=no" "${RUNNER_TEMP}/changes.txt"; then echo "ES_PROD_MIGRATE=1" >> "${GITHUB_ENV}"; fi
            # Automático (encadenado por el CI): un cambio EXTRAORDINARIO no se publica y queda el aviso; manual: falla.
            # Nunca se publica en ninguno de los dos casos.
            if [ "${RC}" = "5" ] && [ "${ES_AUTO}" = "true" ]; then
              echo "::warning title=Core no publicado en production::${ES_DEPLOY_SHA} exige el procedimiento protegido (con aprobación)"
              echo "ES_PROD_SKIP=1" >> "${GITHUB_ENV}"
            elif [ "${RC}" != "0" ]; then
              exit "${RC}"
            fi
          else
            # Live se despliega en nativo desde GitHub: lo que trae se mide contra lo que servía antes de este commit
            FROM=$(pnpm exec tsx scripts/deploy/esRailway.ts active-sha --env "${ES_ENV}" --before "${ES_DEPLOY_SHA}")
            pnpm exec tsx scripts/deploy/esRailway.ts changes ${FROM:+--from "${FROM}"} --to "${ES_DEPLOY_SHA}" | tee "${RUNNER_TEMP}/changes.txt"
            if ! grep -qx "migrations=no" "${RUNNER_TEMP}/changes.txt"; then echo "ES_LIVE_MIGRATE=1" >> "${GITHUB_ENV}"; fi
          fi

      # En live (entorno de pruebas) las migraciones nuevas se aplican solas, con copia antes; en production, nunca aquí
      - name: Publicar — live, copia y migraciones nuevas
        if: inputs.action == 'publicar' && inputs.environment == 'live' && env.ES_LIVE_MIGRATE == '1'
        run: |
          # Las migraciones viajan en la imagen de restore-drill: primero, la de ESTE commit (si no, no aplicaría las nuevas)
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js run"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs registry apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs crm apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js check-data-exports"

      # Production: migraciones ADITIVAS (las destructivas son extraordinarias y no llegan aquí), con copia y verificación de
      # la copia antes; registro y CRM; empresas con canario primero, después Skibox y después el resto. Cualquier fallo
      # detiene la publicación antes de desplegar el código nuevo (el servicio sigue con la versión anterior).
      - name: Publicar — production, copia verificada y migraciones aditivas
        if: inputs.action == 'publicar' && inputs.environment == 'production' && env.ES_PROD_MIGRATE == '1' && env.ES_PROD_SKIP != '1'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js run"
          pnpm exec tsx scripts/deploy/esRailway.ts backup-check --env "${ES_ENV}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs registry apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs crm apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --only t3-empresa-demo-elephant-01 --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js check-data-exports --only t3-empresa-demo-elephant-01"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --only t5-skibox --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js check-data-exports"

      - name: Publicar — controlplane, core y core-gateway (vuelta atrás automática si algo falla)
        if: inputs.action == 'publicar' && env.ES_PROD_SKIP != '1'
        run: pnpm exec tsx scripts/deploy/esRailway.ts publish --env "${ES_ENV}" --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}" --record "${RUNNER_TEMP}/es-core-published.json"

      # CRM (repositorio big-elephant-crm, clave de solo lectura CRM_DEPLOY_KEY del entorno). Live: el último de su rama de
      # integración; production: SOLO el commit del CRM que superó live con este mismo commit del Core (estado
      # elephant-source/crm-live) y sin infraestructura ni dependencias. Vuelta atrás automática si algo falla.
      - name: Publicar — CRM, commit a publicar
        if: inputs.action == 'publicar'
        run: |
          if [ "${ES_ENV}" = "live" ]; then
            echo "ES_CRM_REF=integration/elephant-source" >> "${GITHUB_ENV}"
          else
            CRM=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ES_DEPLOY_SHA}/status" --jq '.statuses[] | select(.context == "elephant-source/crm-live") | .description' | head -1 | sed -n 's/^crm \([0-9a-f]\{40\}\)$/\1/p')
            if [ -z "${CRM}" ]; then
              echo "::notice title=CRM no publicado::ningún commit del CRM superó live con ${ES_DEPLOY_SHA}"
              echo "ES_CRM_SKIP=1" >> "${GITHUB_ENV}"
            else
              echo "ES_CRM_REF=${CRM}" >> "${GITHUB_ENV}"
            fi
          fi

      - name: Publicar — CRM, código (solo lectura)
        if: inputs.action == 'publicar' && env.ES_CRM_SKIP != '1'
        uses: actions/checkout@v4
        with:
          repository: jorgemgrande-stack/big-elephant-crm
          ref: ${{ env.ES_CRM_REF }}
          ssh-key: ${{ secrets.CRM_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: crm-src

      - name: Publicar — CRM (vuelta atrás automática si algo falla)
        id: crm
        if: inputs.action == 'publicar' && env.ES_CRM_SKIP != '1'
        run: |
          CRM_SHA=$(git -C crm-src rev-parse HEAD)
          FROM=$(pnpm exec tsx scripts/deploy/esRailway.ts active-crm --env "${ES_ENV}")
          if [ "${ES_ENV}" = "production" ]; then
            set +e
            pnpm exec tsx scripts/deploy/esRailway.ts crm-changes ${FROM:+--from "${FROM}"} --to "${CRM_SHA}" --dir crm-src --production
            RC=$?
            set -e
            if [ "${RC}" = "5" ] && [ "${ES_AUTO}" = "true" ]; then
              echo "::warning title=CRM no publicado en production::${CRM_SHA} exige el procedimiento protegido (con aprobación)"
              exit 0
            elif [ "${RC}" != "0" ]; then
              exit "${RC}"
            fi
          fi
          mkdir -p "${RUNNER_TEMP}/crm-export"
          git -C crm-src archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/crm-export"
          pnpm exec tsx scripts/deploy/esRailway.ts publish-crm --env "${ES_ENV}" --dir "${RUNNER_TEMP}/crm-export" --sha "${CRM_SHA}"
          if [ "${ES_ENV}" = "live" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${ES_DEPLOY_SHA}" -f state=success -f context=elephant-source/crm-live -f description="crm ${CRM_SHA}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          fi

      # Versiones emparejadas: si el CRM no quedó publicado (ya devuelto a su despliegue anterior), el Core publicado en ESTA
      # ejecución vuelve también al suyo. Así nunca quedan un Core y un CRM que no se probaron juntos. El commit no recibe
      # el estado de live, de modo que production no lo publicará.
      - name: Publicar — vuelta atrás emparejada del Core si falló el CRM
        if: failure() && inputs.action == 'publicar' && steps.crm.outcome == 'failure'
        run: pnpm exec tsx scripts/deploy/esRailway.ts rollback-recorded --env "${ES_ENV}" --file "${RUNNER_TEMP}/es-core-published.json"

      # Web comercial (repositorio bigelephant-web, clave de solo lectura WEB_DEPLOY_KEY del entorno), mismo modelo que el
      # CRM: live publica el último commit de su rama y lo anota (elephant-source/web-live); production publica SOLO ese
      # commit, sin infraestructura, dependencias ni interruptores bloqueados. Vuelta atrás automática si algo falla.
      - name: Publicar — web, commit a publicar
        if: inputs.action == 'publicar'
        run: |
          if [ "${ES_WEB_ENABLED}" != "true" ]; then
            echo "::notice title=Web no publicada::el entorno no tiene WEB_DEPLOY_KEY"
            echo "ES_WEB_SKIP=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          if [ "${ES_ENV}" = "live" ]; then
            echo "ES_WEB_REF=feat/elephant-web-portfolio" >> "${GITHUB_ENV}"
          else
            WEB=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${ES_DEPLOY_SHA}/status" --jq '.statuses[] | select(.context == "elephant-source/web-live") | .description' | head -1 | sed -n 's/^web \([0-9a-f]\{40\}\)$/\1/p')
            if [ -z "${WEB}" ]; then
              echo "::notice title=Web no publicada::ningún commit de la web superó live con ${ES_DEPLOY_SHA}"
              echo "ES_WEB_SKIP=1" >> "${GITHUB_ENV}"
            else
              echo "ES_WEB_REF=${WEB}" >> "${GITHUB_ENV}"
            fi
          fi

      - name: Publicar — web, código (solo lectura)
        if: inputs.action == 'publicar' && env.ES_WEB_SKIP != '1'
        uses: actions/checkout@v4
        with:
          repository: jorgemgrande-stack/bigelephant-web
          ref: ${{ env.ES_WEB_REF }}
          ssh-key: ${{ secrets.WEB_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: web-src

      - name: Publicar — web (vuelta atrás automática si algo falla)
        if: inputs.action == 'publicar' && env.ES_WEB_SKIP != '1'
        run: |
          WEB_SHA=$(git -C web-src rev-parse HEAD)
          FROM=$(pnpm exec tsx scripts/deploy/esRailway.ts active-crm --env "${ES_ENV}" --service web)
          if [ "${ES_ENV}" = "production" ]; then
            set +e
            pnpm exec tsx scripts/deploy/esRailway.ts crm-changes ${FROM:+--from "${FROM}"} --to "${WEB_SHA}" --dir web-src --production
            RC=$?
            set -e
            if [ "${RC}" = "5" ] && [ "${ES_AUTO}" = "true" ]; then
              echo "::warning title=Web no publicada en production::${WEB_SHA} exige el procedimiento protegido (con aprobación)"
              exit 0
            elif [ "${RC}" != "0" ]; then
              exit "${RC}"
            fi
          fi
          mkdir -p "${RUNNER_TEMP}/web-export"
          git -C web-src archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/web-export"
          pnpm exec tsx scripts/deploy/esRailway.ts publish-crm --service web --env "${ES_ENV}" --dir "${RUNNER_TEMP}/web-export" --sha "${WEB_SHA}"
          if [ "${ES_ENV}" = "live" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${ES_DEPLOY_SHA}" -f state=success -f context=elephant-source/web-live -f description="web ${WEB_SHA}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          fi

      - name: Publicar — marcar el commit como superado en live
        if: inputs.action == 'publicar' && inputs.environment == 'live'
        run: gh api "repos/${GITHUB_REPOSITORY}/statuses/${ES_DEPLOY_SHA}" -f state=success -f context=elephant-source/live -f description="Publicado y comprobado en live" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null

      - name: Publicar — marcar el commit como fallido en live
        if: failure() && inputs.action == 'publicar' && inputs.environment == 'live' && env.ES_DEPLOY_SHA != ''
        run: gh api "repos/${GITHUB_REPOSITORY}/statuses/${ES_DEPLOY_SHA}" -f state=failure -f context=elephant-source/live -f description="No superó live" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /dev/null

      - name: Vuelta atrás rápida del servicio (despliegue anterior, sin compilar)
        if: startsWith(inputs.action, 'revertir-')
        run: pnpm exec tsx scripts/deploy/esRailway.ts revert --env "${ES_ENV}" --service "${ES_ACTION#revertir-}"

      - name: Pruebas de live — pasarelas de las empresas de prueba (crear solo en live, desplegar y dominio)
        if: inputs.action == 'preparar-pruebas-live'
        run: pnpm exec tsx scripts/deploy/esRailway.ts test-gateways --env "${ES_ENV}" --only "${ES_ONLY}" --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"

      - name: Desplegar el servicio
        if: (startsWith(inputs.action, 'desplegar-') && inputs.action != 'desplegar-crm' && inputs.action != 'desplegar-web') || inputs.action == 'preparar-pruebas-live'
        run: |
          SERVICE="${ES_ACTION#desplegar-}"
          if [ "${ES_ACTION}" = "preparar-pruebas-live" ]; then SERVICE="core"; fi
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service "${SERVICE}" --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"

      # CRM: el último commit de integration/elephant-source del repositorio privado big-elephant-crm, leído con una
      # clave de despliegue de SOLO LECTURA (secreto CRM_DEPLOY_KEY del entorno). Solo va al servicio crm.
      - name: CRM — código de big-elephant-crm (integration/elephant-source)
        if: inputs.action == 'desplegar-crm'
        uses: actions/checkout@v4
        with:
          repository: jorgemgrande-stack/big-elephant-crm
          ref: integration/elephant-source
          ssh-key: ${{ secrets.CRM_DEPLOY_KEY }}
          persist-credentials: false
          path: crm-src

      - name: CRM — export y despliegue
        if: inputs.action == 'desplegar-crm'
        run: |
          CRM_SHA=$(git -C crm-src rev-parse HEAD)
          mkdir -p "${RUNNER_TEMP}/crm-export"
          git -C crm-src archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/crm-export"
          echo "CRM ${CRM_SHA}: $(git -C crm-src log -1 --format=%s)"
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service crm --repo crm --dir "${RUNNER_TEMP}/crm-export" --sha "${CRM_SHA}"

      # Web comercial: el último commit de feat/elephant-web-portfolio de bigelephant-web (clave de solo lectura
      # WEB_DEPLOY_KEY). Solo va al servicio web. En production, con aprobación (entorno protegido).
      - name: Web — código de bigelephant-web (feat/elephant-web-portfolio)
        if: inputs.action == 'desplegar-web'
        uses: actions/checkout@v4
        with:
          repository: jorgemgrande-stack/bigelephant-web
          ref: feat/elephant-web-portfolio
          ssh-key: ${{ secrets.WEB_DEPLOY_KEY }}
          persist-credentials: false
          path: web-src

      - name: Web — export y despliegue
        if: inputs.action == 'desplegar-web'
        run: |
          WEB_SHA=$(git -C web-src rev-parse HEAD)
          mkdir -p "${RUNNER_TEMP}/web-export"
          git -C web-src archive --format=tar HEAD | tar -x -C "${RUNNER_TEMP}/web-export"
          echo "Web ${WEB_SHA}: $(git -C web-src log -1 --format=%s)"
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service web --repo web --dir "${RUNNER_TEMP}/web-export" --sha "${WEB_SHA}"

      - name: Pruebas de live — las pasarelas de prueba responden en su dominio
        if: inputs.action == 'preparar-pruebas-live'
        run: |
          for T in ${ES_ONLY//,/ }; do
            pnpm exec tsx scripts/deploy/esRailway.ts health --url "https://${T}.up.railway.app/__gateway/health" --expect 200
          done

      - name: Correo de pruebas — desplegar plano de control y Core con las variables nuevas
        if: inputs.action == 'correo-pruebas-live'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service controlplane --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service core --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"

      # Actualización de production en DOS aprobaciones (autorizada por el propietario el 23/10/2026), en el orden del plan
      # (PLAN_PUBLICACION.md). 1) preparar-production: copia, verificación, prueba de restauración y SIMULACIÓN de todas
      # las migraciones (no aplica nada). 2) aplicar-production: solo tras revisar ese plan; aplica en orden, despliega y
      # comprueba. Cada paso falla si no termina bien. MAIL_MODE, cobros, autoservicio e IA no se tocan.
      - name: preparar-production — solo production
        if: inputs.action == 'preparar-production'
        run: if [ "${ES_ENV}" != "production" ]; then echo "preparar-production solo existe en production"; exit 1; fi

      - name: "Preparar production 1/4 — almacenamiento como referencias (backup-job, restore-drill y core; sin desplegar)"
        if: inputs.action == 'preparar-production'
        run: pnpm exec tsx scripts/deploy/esRailway.ts storage-fix --env "${ES_ENV}"

      - name: "Preparar production 2/4 — desplegar backup-job (copias automáticas)"
        if: inputs.action == 'preparar-production'
        run: pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service backup-job --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"

      - name: "Preparar production 3/4 — copia, verificación en el bucket y prueba de restauración de Skibox (base nueva)"
        if: inputs.action == 'preparar-production'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js run"
          pnpm exec tsx scripts/deploy/esRailway.ts backup-check --env "${ES_ENV}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js restore-tenant t5-skibox --apply"

      - name: "Preparar production 4/4 — simulación de todas las migraciones (plataforma y empresas; no aplica nada)"
        if: inputs.action == 'preparar-production'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs registry plan"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs crm status"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node .mig/run.cjs crm plan"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --command "node dist-cp/backup-job.js migrate-tenants"

      - name: aplicar-production — solo production
        if: inputs.action == 'aplicar-production'
        run: if [ "${ES_ENV}" != "production" ]; then echo "aplicar-production solo existe en production"; exit 1; fi

      # Purga DEFINITIVA de las cinco empresas de prueba (lista cerrada en server/_core/ops/purgeTestCompanies.ts; autorizada
      # por el propietario el 28/10/2026). Solo production y por el entorno protegido: imagen de este commit, copia verificada,
      # simulación (aborta si aparece una empresa real, un registro fiscal o de cobro, un dato live o una base compartida),
      # purga y comprobación posterior. El cliente de Stripe de PRUEBAS no se toca (modo test: se borra en su Dashboard).
      - name: "Purga de empresas de prueba 1/3 — imagen de este commit y copia verificada"
        if: inputs.action == 'purgar-empresas-prueba'
        run: |
          if [ "${ES_ENV}" != "production" ]; then echo "La purga de las empresas de prueba solo existe en production"; exit 1; fi
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js run"
          pnpm exec tsx scripts/deploy/esRailway.ts backup-check --env "${ES_ENV}"

      - name: "Purga de empresas de prueba 2/3 — simulación (aborta si toca algo real o fiscal)"
        if: inputs.action == 'purgar-empresas-prueba'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js purge-test-companies"

      - name: "Purga de empresas de prueba 3/3 — purga y comprobación de que no queda nada"
        if: inputs.action == 'purgar-empresas-prueba'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js purge-test-companies --apply"

      - name: "Aplicar production 1/5 — copia inmediatamente antes de migrar"
        if: inputs.action == 'aplicar-production'
        run: |
          # Las migraciones viajan en la imagen de restore-drill: primero, la de ESTE commit (si no, no aplicaría las nuevas)
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service restore-drill --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js run"
          pnpm exec tsx scripts/deploy/esRailway.ts backup-check --env "${ES_ENV}"

      - name: "Aplicar production 2/5 — migraciones de plataforma (registro y CRM)"
        if: inputs.action == 'aplicar-production'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs registry apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs crm apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node .mig/run.cjs crm status"

      - name: "Aplicar production 3/5 — migraciones de las empresas (canario, después Skibox, después el resto)"
        if: inputs.action == 'aplicar-production'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --only t3-empresa-demo-elephant-01 --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js check-data-exports --only t3-empresa-demo-elephant-01"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --only t5-skibox --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js migrate-tenants --apply"
          pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js check-data-exports"

      - name: "Aplicar production 4/5 — desplegar plano de control, Core y pasarela"
        if: inputs.action == 'aplicar-production'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service controlplane --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service core --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"
          pnpm exec tsx scripts/deploy/esRailway.ts deploy --env "${ES_ENV}" --service core-gateway --dir "${RUNNER_TEMP}/export" --sha "${ES_DEPLOY_SHA}"

      # Revisiones de estados del catálogo pendientes (idempotente: lo ya revisado o cambiado desde el CRM no se toca)
      - name: "Aplicar production 4b — revisión de estados del catálogo"
        if: inputs.action == 'aplicar-production'
        run: pnpm exec tsx scripts/deploy/esRailway.ts drill --env "${ES_ENV}" --expect-sha "${ES_DEPLOY_SHA}" --command "node dist-cp/backup-job.js catalog-review --apply"

      - name: "Aplicar production 5/5 — salud pública y acceso de Skibox"
        if: inputs.action == 'aplicar-production'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts health --url "https://app.bigelephant.es/" --expect 200
          pnpm exec tsx scripts/deploy/esRailway.ts health --url "https://skibox.app.bigelephant.es/login" --expect 200
          # Diagnóstico de solo lectura en la misma ejecución aprobada: presencia (nunca valores) de SUPPORT_JWT_SECRET,
          # ERM_DATABASE_URL y CP_CORE_INTERNAL_URL, de los que dependen Accesos y el Resource Manager
          pnpm exec tsx scripts/deploy/esRailway.ts storage --env "${ES_ENV}"

      - name: Salud pública
        if: inputs.action == 'comprobar-salud'
        run: |
          pnpm exec tsx scripts/deploy/esRailway.ts health --url "https://app.bigelephant.es/" --expect 200
